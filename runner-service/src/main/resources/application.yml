spring:
  application:
    name: runner-service
  jackson:
    default-property-inclusion: non_null
    # D3.3 - Spring Boot's own Jackson autoconfiguration defaults to lenient deserialization
    # (unknown JSON fields silently ignored) - confirmed empirically, not assumed, by a request
    # carrying an extra field that Bean Validation alone would never catch (@Valid only sees the
    # fields the object actually has). Explicit here to make the request schema strict.
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  # D2.3 - RunLifecycleStore's own real (JdbcRunStore) implementation is a Spring @Component now
  # that DataSourceAutoConfiguration/FlywayAutoConfiguration are no longer excluded (see
  # RunnerServiceApplication), so every bootRun/deployment needs a real, reachable Postgres. These
  # plain spring.datasource.* keys are standard Spring Boot property names - the portfolio Compose
  # deployment overrides every one of them via the matching SPRING_DATASOURCE_* env vars (see
  # deploy/docker-compose.yml), pointing at its own sibling `postgres` service instead. The defaults
  # below are for local `bootRun` only: `./gradlew.bat localPostgresUp` starts a matching throwaway
  # postgres:17-alpine container on localhost:5433 (not Postgres's usual 5432 - see that task's own
  # comment in runner-service/build.gradle for why) rather than reusing deploy/docker-compose.yml's
  # own `postgres` service (which publishes no host port by design).
  datasource:
    url: jdbc:postgresql://localhost:5433/runner
    username: runner
    password: runner

# address defaults to loopback-only: this service can launch arbitrary Gradle/Playwright processes
# on request, so it must never be reachable from other machines on the network without explicit
# opt-in. A future container deployment overrides this via the standard Spring Boot env var, e.g.
# SERVER_ADDRESS=0.0.0.0 - never change this default directly.
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        # Lax, not Strict: the OAuth callback returns via a top-level GET navigation from
        # github.com, which Strict would block from carrying the session cookie, breaking the
        # login round-trip. CSRF protection (see SecurityConfig) is the primary defense against
        # cross-site state-changing requests regardless of SameSite. `secure` is deliberately not
        # set here - local http://127.0.0.1 dev cannot use a Secure cookie at all; the real
        # deployment sets it explicitly via SERVER_SERVLET_SESSION_COOKIE_SECURE=true (see
        # deploy/runner-service/Dockerfile).
        same-site: lax
      # D3.4 - a single, rarely-used admin session doesn't need a long-lived idle window. This is
      # an IDLE timeout, not an absolute session lifetime (the Servlet HttpSession contract: the
      # clock resets on every access, Spring Boot passes this value straight through) - an
      # actively-used session (stolen or not) is not force-expired at the 4h mark. Chosen as a
      # reasonable "forgot to log out" bound for one admin working session
      # (launch/monitor/cancel a run), not as a hard cap on a compromised session's lifetime; see
      # SecurityAccessMatrixTest#anInvalidatedSessionIsTreatedAsAnonymousNeverAsLingeringAdminOrAServerError
      # for what this project actually tests here (post-invalidation behavior, not the idle-timeout
      # clock itself - MockMvc has no way to simulate real wall-clock idle time elapsing).
      timeout: 4h

management:
  endpoints:
    web:
      exposure:
        include: health,info

# deployment-profile defaults to LOCAL_DEV (today's unrestricted behavior: every combination
# RunCatalog allows, PUBLIC and LOCAL alike). The portfolio Compose deployment overrides this to
# PORTFOLIO (RUNNER_DEPLOYMENTPROFILE=PORTFOLIO - see deploy/docker-compose.yml) to hide
# Environment.LOCAL from /api/v1/capabilities and reject it outright at the validator - see
# RunAvailabilityPolicy and docs/DEPLOYMENT_ARCHITECTURE.md section 2.
runner:
  deployment-profile: LOCAL_DEV
  # repo-root defaults to "." - this service is expected to be launched with the repository root
  # (the directory containing gradlew/gradlew.bat) as its working directory.
  repo-root: .
  process-timeout: PT10M
  raw-events-dir: build/runner-events/raw
  logs-dir: build/runner-logs
  test-catalog-path: src/test/resources/catalog/public-test-catalog.json
  artifacts-dir: build/runner-artifacts
  process-log-max-bytes: 10485760
  termination-grace-period: PT5S
  degraded-poll-interval: PT2S
  queue-capacity: 5
  ingestion-poll-interval: PT0.15S
  ingestion-drain-timeout: PT5S
  sse-max-subscribers: 100
  sse-heartbeat-interval: PT15S
  sse-emitter-timeout: PT10M
  # D3.3 - abuse protection. Every threshold below is a *rate* (or concurrent-connection) limit,
  # distinct from queue-capacity above (which bounds how many runs may wait behind the one
  # executing, never how often a client may call an endpoint at all).
  oauth-authorization-rate-limit:
    max-attempts: 5
    window: PT1M
  oauth-callback-rate-limit:
    max-attempts: 10
    window: PT1M
  create-run-rate-limit-per-minute:
    max-attempts: 3
    window: PT1M
  create-run-rate-limit-per-hour:
    max-attempts: 10
    window: PT1H
  cancel-run-rate-limit:
    max-attempts: 10
    window: PT1M
  public-read-rate-limit:
    max-attempts: 120
    window: PT1M
  download-rate-limit:
    max-attempts: 30
    window: PT1M
  sse-max-connections-per-ip: 3
  max-request-body-bytes: 16384
  # D4.1 - retention. A terminal run is fully cleaned up once EITHER bound below is exceeded (age
  # or count, whichever first) - see RetentionService's own Javadoc for the exact kept-set
  # definition. Artifact files get their own, shorter, independent window, measured from the
  # owning run's own finished_at (never individual artifact ingestion timestamps).
  retention-run-history-max-age: P30D
  retention-run-history-max-count: 500
  retention-artifact-max-age: P14D
  retention-cleanup-interval: PT1H
  # D4.1 review round - retention/preview/run are real DB+filesystem work, so they get their own
  # conservative admin-keyed rate limit like every other AbuseRateLimitFilter surface, not left
  # uncapped just because the caller is already an authorized admin.
  retention-rate-limit:
    max-attempts: 10
    window: PT1H
  # D4.2 - disk protection. Defaults locked off real measurements taken against this repo's own
  # workspace (2026-09-08): observed screenshots ~0.8-1.5 MB, traces ~1.3-2.4 MB, a historical Allure
  # corpus averaging ~1.06 MB/screenshot and ~0.73 MB/trace across 750 files; raw event JSONL topped
  # out at ~204 KB and process logs at ~5 KB across nearly a thousand real historical runs. Each
  # value below is deliberately generous relative to those real numbers, not a guess.
  disk-min-free-bytes: 1073741824 # 1 GiB
  artifact-max-bytes: 26214400 # 25 MiB - single screenshot/trace/video file
  run-max-total-artifact-bytes: 209715200 # 200 MiB - one run's whole artifact footprint
  manifest-max-bytes: 2097152 # 2 MiB
  raw-event-max-bytes: 2097152 # 2 MiB
  managed-scratch-max-bytes: 104857600 # 100 MiB - Gradle/JUnit report/temp reserve, not enforced
  disk-usage-rate-limit:
    max-attempts: 10
    window: PT1H
