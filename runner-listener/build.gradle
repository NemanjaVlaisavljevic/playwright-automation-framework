plugins {
    id 'java-library'
}

group = 'dev.vlaisanem.automation'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':runner-contract')

    implementation platform('org.junit:junit-bom:6.0.1')
    implementation 'org.junit.platform:junit-platform-launcher'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2'

    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // RunnerEventTestExecutionListenerTest's nested Fixture/DisabledFixture classes are deliberately
    // failing/skipping sample classes executed through an explicit inner Launcher call, not real
    // tests of this module - exclude every nested class of that test from this task's own JUnit
    // Platform discovery, or their intentional failures/skips fail this build.
    filter {
        excludeTestsMatching '*RunnerEventTestExecutionListenerTest$*'
    }
}
