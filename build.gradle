import java.time.Duration
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.10.0'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'dev.vlaisanem.automation'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // testImplementation, not testRuntimeOnly: TestCatalogGenerator (tooling/) needs compile-time
    // access to the Launcher API to discover the CUSTOM-suite catalog - see that class's Javadoc.
    testImplementation 'org.junit.platform:junit-platform-launcher'

    // Auto-discovered via META-INF/services/org.junit.platform.launcher.TestExecutionListener -
    // emits one RunnerEvent JSONL line per test start/finish/skip. See runner-listener module.
    // testImplementation, not testRuntimeOnly: the Steps API (core.Steps) needs compile-time access
    // to RunnerEventWriterRegistry, the single shared writer both it and the listener append
    // through - see that class's own Javadoc for why there can only ever be one per runId.
    testImplementation project(':runner-listener')

    // The ArtifactManifestEntry/ArtifactType record+enum shared with runner-service - the
    // process-boundary contract this framework's own ArtifactManifestWriter writes against. Has no
    // dependency of its own (no Playwright/Spring/Jackson, no dependency on this project), so this
    // adds nothing beyond the one small module itself.
    testImplementation project(':runner-contract')

    testImplementation 'com.microsoft.playwright:playwright:1.62.0'
    testImplementation 'org.assertj:assertj-core:3.27.6'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2'
    testImplementation 'com.networknt:json-schema-validator:2.0.4'
    testImplementation 'io.qameta.allure:allure-jupiter:2.35.4'
    testImplementation 'org.slf4j:slf4j-api:2.0.18'
    // Playwright's Page/BrowserContext/Tracing are interfaces specifically to allow this - used
    // only to unit-test TestFixture's independent-artifact-capture failure handling (TestFixtureTest)
    // without a real browser. Mockito 5's inline mock maker (the default, no separate mockito-inline
    // artifact needed) is also what makes mocking the static io.qameta.allure.Allure.addAttachment
    // possible there.
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.22'
}

// The runner-listener module writes one JSONL file per runId (see RunnerEventTestExecutionListener)
// and assumes exactly one JVM process ever writes it. Gradle's Test JVM does not inherit -D system
// properties from the Gradle invocation by default (only environment variables are inherited
// automatically) - so runner.runId/runner.rawEventsDir must be forwarded explicitly here to reach a
// forked test JVM launched with them. maxParallelForks is pinned to 1 (Gradle's own default, but
// made explicit rather than relied upon) because the listener's in-JVM lock cannot protect a shared
// runId file against a second, separate Gradle test worker process.
//
// Deliberately forwards ONLY when the runner-service already supplied a value - no fallback
// generated here. An earlier version of this closure generated a random UUID on every invocation
// when absent, which (a) only ran once per configured Test task, not once per Gradle invocation,
// so multiple tasks in one invocation would each mint their own value; (b) never applied at all to
// a JVM launched outside Gradle entirely (an IDE's own JUnit runner, a bare `java` invocation); and
// (c) made every local `./gradlew test` set a fresh random systemProperty on the Test task, which
// Gradle treats as a task input - a volatile value there defeats build-cache/up-to-date checking on
// every single run, worse than not caching at all. The shared fallback (an unmanaged run gets one
// consistent identity, however the JVM was launched) now lives entirely inside the JVM itself, in
// runner-contract's RunnerExecutionIdentity - both TestConfig and RunnerEventTestExecutionListener
// resolve through it, so this closure never needs to invent or forward a fallback value at all.
def forwardRunnerEventProperties = { Test task ->
    ['runner.runId', 'runner.rawEventsDir'].each { property ->
        def value = System.getProperty(property)
        if (value) {
            task.systemProperty property, value
        }
    }
    task.maxParallelForks = 1
}

def configureAutomationTest = { Test task ->
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.useJUnitPlatform {
        excludeTags 'mutation'
        // The controlled step/failure/artifact drill-down fixture (Faza B) deliberately fails on
        // purpose - it must never be swept into a real suite alongside `mutation`. It still carries
        // the mandatory `regression` tag AutomationExtension requires unconditionally; this is the
        // only thing keeping it out of every real suite. Only `fixtureTest` (below) includes it.
        excludeTags 'fixture'
    }
    task.systemProperty 'file.encoding', 'UTF-8'
    forwardRunnerEventProperties(task)
    task.testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
    task.reports.junitXml.required = true
    task.reports.html.required = true
}

tasks.named('test', Test) {
    configureAutomationTest(delegate)
}

tasks.register('smokeTest', Test) {
    description = 'Runs fast read-only smoke checks.'
    group = 'verification'
    configureAutomationTest(delegate)
    useJUnitPlatform {
        includeTags 'smoke'
        excludeTags 'mutation'
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('apiTest', Test) {
    description = 'Runs read-only API checks.'
