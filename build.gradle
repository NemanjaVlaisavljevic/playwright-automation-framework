// Deliberately excluded from `configureAutomationTest`'s excludeTags 'fixture' guard above - this
// is the one task allowed to run it, on demand (a Gradle invocation or the runner's FIXTURE suite).
tasks.register('fixtureTest', Test) {
    description = 'Runs the controlled step/failure/artifact drill-down fixture (Faza B) - always fails on purpose.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'fixture'
    }
    systemProperty 'file.encoding', 'UTF-8'
    forwardRunnerEventProperties(delegate)
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    reports.junitXml.required = true
    reports.html.required = true
    shouldRunAfter tasks.named('test')
}

// D0.5 - launched only by RunService with a server-validated `--tests` filter appended per request
// (see SuiteCommandFactory), never invoked bare. configureAutomationTest's own excludeTags
// 'mutation'/'fixture' apply here too - a defense-in-depth backstop, not the primary safety
// mechanism (that is the server-side catalog validation a testKey must pass before ever reaching
// this task's command line at all).
tasks.register('customTest', Test) {
    description = 'Runs a server-selected subset of PUBLIC read-only tests - never invoked directly, only via the dashboard/API.'
    group = 'verification'
    configureAutomationTest(delegate)
    reports.junitXml.required = true
    reports.html.required = true
}

// --- Local Restful Booker Platform stack (Docker Compose) ---------------------------------
// See infra/rbp/README.md. None of this is wired into the default `test` task: bringing up
// Docker / fetching upstream source is always an explicit, separate step the developer opts into.

def rbpUpstreamProps = new Properties()
file('infra/rbp/upstream.properties').withInputStream { rbpUpstreamProps.load(it) }
def rbpRepo = rbpUpstreamProps.getProperty('repository')
def rbpCommit = rbpUpstreamProps.getProperty('commit')
if (rbpCommit == null || !(rbpCommit ==~ /[0-9a-f]{40}/)) {
    throw new GradleException(
        "infra/rbp/upstream.properties: commit must be exactly 40 lowercase hex characters, was '${rbpCommit}'")
}
def rbpSutRoot = file('build/rbp-sut')
def rbpSutDir = new File(rbpSutRoot, rbpCommit)
if (!rbpSutDir.toPath().normalize().startsWith(rbpSutRoot.toPath().normalize())) {
    throw new GradleException("localSutPrepare: resolved rbpSutDir escapes build/rbp-sut/: ${rbpSutDir}")
}
def rbpComposeFile = file("${rbpSutDir}/docker-compose.yml")
def rbpOverrideFile = file('infra/rbp/compose.override.yml')
def rbpComposeProject = 'rbp-local-sut'
def rbpJavaModules = ['auth', 'booking', 'room', 'report', 'branding', 'message']
def rbpLocalBaseUrl = 'http://localhost'
def rbpHealthEndpoints = [
    auth    : 'http://localhost:3004/auth/actuator/health',
    booking : 'http://localhost:3000/booking/actuator/health',
    room    : 'http://localhost:3001/room/actuator/health',
    report  : 'http://localhost:3005/report/actuator/health',
    branding: 'http://localhost:3002/branding/actuator/health',
    message : 'http://localhost:3006/message/actuator/health',
]
// GET-only checks against the assets front door itself - the 6 endpoints above only prove each
// Java service is up, not that assets' rewrite proxy actually reaches them (see the compatibility
// patch below: a build-time env bug there previously made by-id routes 500 while list routes and
// the actuator endpoints stayed green).
def rbpFrontDoorEndpoints = [
    'http://localhost/',
    'http://localhost/api/room/',
    'http://localhost/api/room/1',
]
def rbpPatchFile = file('infra/rbp/patches/assets-build-env.patch')
def rbpPatchMarkerFor = { ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    def hash = digest.digest(rbpPatchFile.bytes).encodeHex().toString()
    "local: apply build-env compatibility patch (infra/rbp/patches/assets-build-env.patch, sha256:${hash})"
}

def rbpComposeCommand = { composeArgs ->
    ['docker', 'compose', '-p', rbpComposeProject, '-f', rbpComposeFile.absolutePath, '-f', rbpOverrideFile.absolutePath] + composeArgs
}

// Project.exec()/copy() (the `exec { ... }` closure sugar used inside a task action) was removed
// in this Gradle version, so shell out via plain ProcessBuilder instead - no Gradle service needed.
// Elements are coerced with toString() because GStrings (from string interpolation) are not
// java.lang.String and ProcessBuilder requires real Strings. inheritIO() is deliberately NOT used:
// the Gradle daemon has no real console, and letting a child try to inherit its console handles on
// Windows hangs indefinitely after the command has otherwise finished (observed with `docker compose
// up`, which built every image successfully and then never returned) - piping and relaying line by
// line avoids that.
def rbpRun = { command, File workDir = null ->
    def builder = new ProcessBuilder(command.collect { it.toString() })
    if (workDir != null) {
        builder.directory(workDir)
    }
    builder.redirectErrorStream(true)
    Process process = builder.start()
    process.inputStream.newReader('UTF-8').eachLine { line -> logger.lifecycle(line) }
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Command failed (exit ${exitCode}): ${command.join(' ')}")
    }
}

def rbpCapture = { command, File workDir = null ->
    def builder = new ProcessBuilder(command.collect { it.toString() })
    if (workDir != null) {
        builder.directory(workDir)
    }
    builder.redirectErrorStream(true)
    Process process = builder.start()
    String output = process.inputStream.getText('UTF-8')
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Command failed (exit ${exitCode}): ${command.join(' ')}\n${output}")
    }
    return output.trim()
}

tasks.register('localSutPrepare') {
    description = 'Fetches the pinned upstream Restful Booker Platform commit into build/rbp-sut/<commit> ' +
        'and applies our local build-env compatibility patch on top (see infra/rbp/patches/).'
    group = 'local sut'
    inputs.file(rbpPatchFile)
    outputs.dir(rbpSutDir)
    doLast {
        def patchMarker = rbpPatchMarkerFor()
        if (rbpSutDir.exists() && new File(rbpSutDir, '.git').exists()) {
            def headMessage = rbpCapture(['git', 'log', '-1', '--format=%s'], rbpSutDir)
            def parentSha = null
            try {
                parentSha = rbpCapture(['git', 'rev-parse', 'HEAD~1'], rbpSutDir)
            } catch (ignored) {
                // No parent commit means the patch was never applied - fall through to re-prepare.
            }
            if (headMessage == patchMarker && parentSha == rbpCommit) {
                logger.lifecycle("localSutPrepare: ${rbpCommit} already fetched and patched at ${rbpSutDir}")
                return
            }
        }
        rbpSutDir.deleteDir()
        rbpSutDir.mkdirs()
        rbpRun(['git', 'init', '-q'], rbpSutDir)
        rbpRun(['git', 'remote', 'add', 'origin', rbpRepo], rbpSutDir)
        rbpRun(['git', 'fetch', '--depth', '1', 'origin', rbpCommit], rbpSutDir)
        rbpRun(['git', 'checkout', '-q', '--detach', 'FETCH_HEAD'], rbpSutDir)
        rbpRun(['git', 'config', 'user.email', 'automation@local'], rbpSutDir)
        rbpRun(['git', 'config', 'user.name', 'automation'], rbpSutDir)
        // Fails loudly (non-zero exit -> GradleException) if a future re-pin of `commit` no longer
        // matches this patch's context lines, instead of silently applying it somewhere wrong.
        rbpRun(['git', 'apply', '--check', rbpPatchFile.absolutePath], rbpSutDir)
        rbpRun(['git', 'apply', rbpPatchFile.absolutePath], rbpSutDir)
        rbpRun(['git', 'commit', '-q', '-am', patchMarker], rbpSutDir)
        logger.lifecycle("localSutPrepare: fetched ${rbpCommit} into ${rbpSutDir} and applied the local compatibility patch")
    }
}

tasks.register('localSutBuild') {
    description = 'Builds the 6 Java RBP service jars in a throwaway Maven container (upstream\'s ' +
        'own Dockerfiles expect target/*.jar to already exist; they do not build it themselves).'
    group = 'local sut'
    dependsOn 'localSutPrepare'
    doLast {
        def mountPath = rbpSutDir.absolutePath.replace('\\', '/')
        rbpRun([
            'docker', 'run', '--rm',
            '-v', "${mountPath}:/workspace",
            '-v', 'rbp-m2-cache:/root/.m2',
            '-w', '/workspace',
            'maven:3.9-eclipse-temurin-26',
            'mvn', '-q', '-pl', rbpJavaModules.join(','), '-am', 'clean', 'install', '-DskipTests',
        ])
        rbpJavaModules.each { module ->
            def jars = fileTree("${rbpSutDir}/${module}/target") { include '*-exec.jar' }
            if (jars.isEmpty()) {
                throw new GradleException("localSutBuild: no exec jar produced for module '${module}'")
            }
        }
        logger.lifecycle("localSutBuild: built jars for ${rbpJavaModules}")
    }
}

tasks.register('localSutUp') {
    description = 'Builds and starts all 7 RBP services via Docker Compose.'
    group = 'local sut'
    dependsOn 'localSutBuild'
    doLast {
        rbpRun(rbpComposeCommand(['up', '-d', '--build']))
    }
}

def rbpDiagnosticsDir = file('build/diagnostics/rbp')

// Shared by the standalone localSutDiagnostics task and localSutHealth's own on-failure dump below -
// writes files (for CI artifact upload) as well as logging to the console (for local dev visibility).
def rbpWriteDiagnostics = {
    logger.lifecycle('localSutDiagnostics: dumping compose state and logs for diagnosis...')
    rbpDiagnosticsDir.mkdirs()
    try {
        def psOutput = rbpCapture(rbpComposeCommand(['ps', '--all']))
        logger.lifecycle(psOutput)
        new File(rbpDiagnosticsDir, 'compose-ps.txt').setText(psOutput, 'UTF-8')
    } catch (GradleException exception) {
        logger.lifecycle("localSutDiagnostics: 'compose ps' failed: ${exception.message}")
        new File(rbpDiagnosticsDir, 'compose-ps.txt').setText("compose ps failed: ${exception.message}", 'UTF-8')
    }
    try {
        def logsOutput = rbpCapture(rbpComposeCommand(['logs', '--tail', '100', '--no-color', '--timestamps']))
        logger.lifecycle(logsOutput)
        new File(rbpDiagnosticsDir, 'compose-logs.txt').setText(logsOutput, 'UTF-8')
    } catch (GradleException exception) {
        logger.lifecycle("localSutDiagnostics: 'compose logs' failed: ${exception.message}")
        new File(rbpDiagnosticsDir, 'compose-logs.txt').setText("compose logs failed: ${exception.message}", 'UTF-8')
    }
}

tasks.register('localSutDiagnostics') {
    description = 'Dumps `docker compose ps`/`logs` for the local RBP stack to build/diagnostics/rbp/ ' +
        '(for CI artifact upload) and to the console. Deliberately does not depend on localSutUp/' +
        'localSutBuild - safe to run any time, including right after localTest fails in CI, without ' +
        'rebuilding or restarting the stack it is trying to diagnose.'
    group = 'local sut'
    outputs.dir(rbpDiagnosticsDir)
    // No inputs are declared (there is nothing meaningful to hash - this reflects live container
    // state), so without this a second invocation whose output directory still matches what was
    // recorded last time would be marked UP-TO-DATE and skip re-dumping, silently leaving stale logs.
    outputs.upToDateWhen { false }
    doLast {
        rbpWriteDiagnostics()
    }
}

// Shared by localSutHealth (startup-tolerant, long timeouts, depends on localSutUp) and
// localSutVerifyRunning (fast-fail precondition for tasks like localJourneyTest, no dependsOn at
// all - never starts/stops/rebuilds anything). `taskName` is only used to make log/error messages
// accurately name whichever of the two actually invoked this, not always "localSutHealth".
def rbpVerifyHealthy = { String taskName, Duration healthTimeout, Duration frontDoorTimeout ->
    def deadline = System.currentTimeMillis() + healthTimeout.toMillis()
    def pending = new LinkedHashMap<>(rbpHealthEndpoints)
    while (!pending.isEmpty() && System.currentTimeMillis() < deadline) {
        def stillPending = new LinkedHashMap<>()
        pending.each { name, url ->
            boolean up = false
            try {
                def connection = new URL(url).openConnection()
                connection.connectTimeout = 2000
                connection.readTimeout = 2000
                up = connection.responseCode == 200 && connection.inputStream.text.contains('"UP"')
            } catch (ignored) {
                up = false
            }
            if (!up) {
                stillPending[name] = url
            }
        }
        pending = stillPending
        if (!pending.isEmpty()) {
            Thread.sleep(2000)
        }
    }
    if (!pending.isEmpty()) {
        rbpWriteDiagnostics()
        throw new GradleException(
            "${taskName}: services not healthy after ${healthTimeout}: ${pending.keySet()}")
    }
    logger.lifecycle("${taskName}: all services UP (${rbpHealthEndpoints.keySet()})")

    // HttpURLConnection does not auto-follow 307/308 (unlike Playwright's APIRequestContext,
    // which the real tests use) - Next.js issues a 308 for its own trailing-slash normalization,
    // which is not a failure. Follow redirects manually so we assert on the final status.
    def httpStatusFollowingRedirects = { String startUrl ->
        String currentUrl = startUrl
        int code = -1
        for (int hop = 0; hop <= 5; hop++) {
            def connection = new URL(currentUrl).openConnection()
            connection.connectTimeout = 5000
            connection.readTimeout = 5000
            connection.instanceFollowRedirects = false
            code = connection.responseCode
            if (!(code in [301, 302, 303, 307, 308])) {
                break
            }
            def location = connection.getHeaderField('Location')
            if (!location) {
                break
            }
            currentUrl = new URL(new URL(currentUrl), location).toString()
        }
        return code
    }
    def frontDoorDeadline = System.currentTimeMillis() + frontDoorTimeout.toMillis()
    def frontDoorFailures = []
    while (true) {
        frontDoorFailures = []
        rbpFrontDoorEndpoints.each { url ->
            try {
                int code = httpStatusFollowingRedirects(url)
                if (code != 200) {
                    frontDoorFailures << "${url} -> ${code}"
                }
            } catch (Exception exception) {
                frontDoorFailures << "${url} -> ${exception.message}"
            }
        }
        if (frontDoorFailures.isEmpty() || System.currentTimeMillis() >= frontDoorDeadline) {
            break
        }
        Thread.sleep(2000)
    }
    if (!frontDoorFailures.isEmpty()) {
        rbpWriteDiagnostics()
        throw new GradleException(
            "${taskName}: assets front door not healthy: ${frontDoorFailures}")
    }
    logger.lifecycle("${taskName}: assets front door OK (${rbpFrontDoorEndpoints})")
}

tasks.register('localSutHealth') {
    description = 'Polls each RBP Java service actuator endpoint plus the assets front door ' +
        '(list AND by-id, to catch proxy-only failures the actuator endpoints miss) until healthy, ' +
        'or fails. No fixed blind startup delay - polls on a short interval against a deadline instead.'
    group = 'local sut'
    dependsOn 'localSutUp'
    doLast {
        rbpVerifyHealthy('localSutHealth', Duration.ofMinutes(5), Duration.ofMinutes(2))
    }
}

// Deliberately NOT dependsOn localSutUp/localSutBuild/localSutPrepare - unlike localSutHealth,
// this is meant as a fast precondition for a task (localJourneyTest) that assumes a developer
// already brought the stack up by hand with `./gradlew.bat localSutUp`. Never starts, stops, or
// rebuilds anything itself, and fails fast and clearly (short timeouts) if the stack isn't there,
// rather than waiting through localSutHealth's full startup-tolerant window.
tasks.register('localSutVerifyRunning') {
    description = 'Fails fast if the local RBP stack is not already up and healthy - never starts, ' +
        'stops, or rebuilds it (see localSutHealth for the startup-tolerant version this shares its ' +
        'actual check with). Intended as a precondition for tasks like localJourneyTest.'
    group = 'local sut'
    doLast {
        rbpVerifyHealthy('localSutVerifyRunning', Duration.ofSeconds(10), Duration.ofSeconds(10))
    }
}

tasks.register('localSutDown') {
    description = 'Stops the local RBP stack.'
    group = 'local sut'
    doLast {
        rbpRun(rbpComposeCommand(['down']))
    }
}

tasks.register('localSutReset') {
    description = 'Stops the local RBP stack and removes its containers and volumes.'
    group = 'local sut'
    doLast {
        rbpRun(rbpComposeCommand(['down', '-v']))
    }
}

tasks.register('localTest', Test) {
    description = 'Runs the full regression suite (read-only + mutation) against the local RBP stack.'
    group = 'verification'
    dependsOn 'localSutHealth'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Every mutation test also carries the mandatory 'regression' tag (see AutomationExtension),
    // so including 'regression' with no exclusion already pulls in both read-only and mutation tests.
    // 'fixture' is excluded for the same reason it is everywhere else: it always fails on purpose.
    useJUnitPlatform {
        includeTags 'regression'
        excludeTags 'fixture'
    }
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'baseUrl', rbpLocalBaseUrl
    forwardRunnerEventProperties(delegate)
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
    reports.junitXml.required = true
    reports.html.required = true
    shouldRunAfter tasks.named('test')
}

// The Environment.LOCAL + Suite.JOURNEY entry in RunCatalog - lets the dashboard launch a real
// mutation-tagged journey test (BookingJourneyTest and friends) without ever writing to the shared
// public target: baseUrl is baked in as localhost, and TestConfig#targetsSharedEnvironment()
// naturally returns false for that origin, so AutomationExtension's mutation guard passes with no
// allowMutationAgainstSharedTarget opt-in needed. Deliberately depends on localSutVerifyRunning, not
// localSutHealth/localSutUp: the runner-service process that will eventually launch this task must
// never itself start, stop, or rebuild the Docker stack - a developer brings it up by hand first.
tasks.register('localJourneyTest', Test) {
    description = 'Runs the journey suite (read-only + mutation) against an already-running local RBP stack.'
    group = 'verification'
    dependsOn 'localSutVerifyRunning'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // No excludeTags 'mutation' here - that is the entire point of this task existing separately
    // from the public journeyTest one. 'fixture' is still excluded for the same reason as everywhere
    // else: it always fails on purpose.
    useJUnitPlatform {
        includeTags 'journey'
        excludeTags 'fixture'
    }
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'baseUrl', rbpLocalBaseUrl
    forwardRunnerEventProperties(delegate)
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
    reports.junitXml.required = true
    reports.html.required = true
    shouldRunAfter tasks.named('test')
}

tasks.register('stabilityTest') {
    description = 'Reruns localTest repeatedly to build confidence in local-stack determinism. ' +
        'Configure the count with -PstabilityRuns=N (default 10). Brings the stack up once (not ' +
        'once per iteration), then reruns just the test execution. Runs every iteration regardless ' +
        'of earlier failures, then reports a pass/fail summary; fails overall if any run failed.'
    group = 'verification'
    dependsOn 'localSutHealth'
    doLast {
        int runs = (project.findProperty('stabilityRuns') ?: '10') as int
        if (runs < 1) {
            throw new GradleException("stabilityTest: -PstabilityRuns must be a positive integer, was ${runs}")
        }
        def resultsRoot = file('build/stability-results')
        resultsRoot.deleteDir()
        resultsRoot.mkdirs()
        def wrapperName = OperatingSystem.current().isWindows() ? 'gradlew.bat' : 'gradlew'
        def wrapper = new File(project.projectDir, wrapperName).absolutePath
        def outcomes = [:]
        for (int i = 1; i <= runs; i++) {
            logger.lifecycle("stabilityTest: run ${i}/${runs}")
            // The stack is already up (see dependsOn above) - exclude the infra tasks so each
            // iteration only reruns the JUnit execution itself against the already-running stack,
            // instead of re-fetching/re-building/re-verifying it 10 times over.
            def stabilityProcessBuilder = new ProcessBuilder([
                wrapper, 'localTest', '--rerun',
                '-x', 'localSutPrepare', '-x', 'localSutBuild', '-x', 'localSutUp', '-x', 'localSutHealth',
            ]).directory(project.projectDir)
            stabilityProcessBuilder.redirectErrorStream(true)
            Process stabilityProcess = stabilityProcessBuilder.start()
            stabilityProcess.inputStream.newReader('UTF-8').eachLine { line -> logger.lifecycle(line) }
            int exitCode = stabilityProcess.waitFor()
            def runDir = new File(resultsRoot, "run-${i}")
            runDir.mkdirs()
            copy {
                from 'build/test-results/localTest'
                into new File(runDir, 'test-results')
            }
            copy {
                from 'build/reports/tests/localTest'
                into new File(runDir, 'reports')
            }
            outcomes[i] = exitCode == 0
            logger.lifecycle("stabilityTest: run ${i}/${runs} ${exitCode == 0 ? 'PASSED' : 'FAILED'}")
        }
        int passed = outcomes.values().count { it }
        logger.lifecycle("stabilityTest: ${passed}/${runs} runs passed. Reports retained under ${resultsRoot}")
        if (passed != runs) {
            def failedRuns = outcomes.findAll { !it.value }.keySet()
            throw new GradleException(
                "stabilityTest: ${runs - passed}/${runs} runs failed (runs ${failedRuns}); " +
                    "see per-run reports under ${resultsRoot}")
        }
    }
}

// --- Dashboard E2E (real browser + real runner-service + real runner-dashboard) -----------------
// Deliberately its own source set, not just another tag-filtered Test task over sourceSets.test:
// these tests exercise the runner-dashboard/runner-service stack itself, not Restful Booker
// Platform, so they share none of AutomationExtension's RBP-facing tag taxonomy and must never be
// reachable by any Gradle task name the runner-service's own RunRequestValidator allowlist could
// launch (that allowlist is the actual recursion guard - this source set living outside `test`
// entirely, and this task never being wired into `check`, is what keeps it outside that allowlist
// in the first place).
sourceSets {
    dashboardE2eTest {
        java.srcDir('src/dashboardE2eTest/java')
        resources.srcDir('src/dashboardE2eTest/resources')
    }
}

configurations {
    dashboardE2eTestImplementation.extendsFrom testImplementation
}

// Deliberately NOT dashboardE2eTestRuntimeOnly.extendsFrom(testRuntimeOnly): that would pull in
// `project(':runner-listener')`, whose META-INF/services-registered TestExecutionListener
// auto-discovers on ANY JUnit Platform launcher classpath and starts writing its own raw JSONL
// event files (see RunnerEventTestExecutionListener) - confirmed live, running this suite once
// produced build/runner-events/raw/local-*.tests.jsonl files that this suite's tests have nothing
// to do with. Listed out explicitly instead so this source set only ever gets what it actually
// needs to execute JUnit Platform tests at all.
dependencies {
    dashboardE2eTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    dashboardE2eTestRuntimeOnly 'ch.qos.logback:logback-classic:1.5.22'
}

// Builds the dashboard's production bundle once, ahead of the whole dashboardE2eTest run - shared
// by both DashboardE2eEnvironment's own instance and BackendUnavailableE2eTest's isolated one (see
// their respective `vite preview` invocations), each serving the same dist/ on its own port. Normal
// Gradle up-to-date checking applies here (unlike dashboardE2eTest itself, just below) - there is no
// reason to rebuild an unchanged bundle on every invocation.
tasks.register('dashboardBuild', Exec) {
    description = 'Builds the runner-dashboard production bundle for dashboardE2eTest.'
    group = 'verification'
    workingDir file('runner-dashboard')
    if (OperatingSystem.current().isWindows()) {
        commandLine 'cmd.exe', '/c', 'npm.cmd', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
    inputs.dir(file('runner-dashboard/src'))
    inputs.dir(file('runner-dashboard/public'))
    inputs.files(
        file('runner-dashboard/package.json'),
        file('runner-dashboard/package-lock.json'),
        file('runner-dashboard/index.html'),
        file('runner-dashboard/vite.config.ts'),
        file('runner-dashboard/tsconfig.json'),
        file('runner-dashboard/tsconfig.app.json'),
        file('runner-dashboard/tsconfig.node.json'))
    outputs.dir(file('runner-dashboard/dist'))
}

tasks.register('dashboardE2eTest', Test) {
    description = 'Real-browser Playwright E2E tests against a real runner-service + runner-dashboard.'
    group = 'verification'
    testClassesDirs = sourceSets.dashboardE2eTest.output.classesDirs
    classpath = sourceSets.dashboardE2eTest.runtimeClasspath
    dependsOn ':runner-service:bootJar', 'dashboardBuild'
    useJUnitPlatform()
    // This task starts real OS processes (a real backend, a real dashboard server) and drives a
    // real public target through a real browser on every invocation - it has side effects Gradle's
    // input/output modeling cannot see, so treating it as cacheable/up-to-date like an ordinary
    // Test task would let a re-run silently report stale PASSED results without ever touching the
    // real system again.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    // The shared backend (a single-worker executor - see RunService), fixed dashboard ports, and
    // DashboardE2eEnvironment's own root-context-store "start once" pattern all assume exactly one
    // test class executes at a time - both at the Gradle-worker level and inside the JUnit Platform
    // engine itself.
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    systemProperty 'file.encoding', 'UTF-8'
    // The exact jar path (Spring Boot's own naming/versioning), and where the two sibling
    // directories this suite orchestrates actually live - resolved once here rather than
    // re-guessed in Java, since `runner-dashboard/` is deliberately not a Gradle module itself
    // (see its own README) and has no other way to tell this task where it is.
    systemProperty 'dashboardE2e.runnerServiceJar',
        tasks.getByPath(':runner-service:bootJar').archiveFile.get().asFile.absolutePath
    systemProperty 'dashboardE2e.repoRoot', rootProject.projectDir.absolutePath
    systemProperty 'dashboardE2e.dashboardDir', file('runner-dashboard').absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
    reports.junitXml.required = true
    reports.html.required = true
}

tasks.register('playwrightInstall', JavaExec) {
    description = 'Installs the Playwright browser selected with -Pbrowser (chromium by default).'
    group = 'playwright'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    if (providers.gradleProperty('withDeps').getOrElse('false').toBoolean()) {
        args 'install', '--with-deps', providers.gradleProperty('browser').getOrElse('chromium')
    } else {
        args 'install', providers.gradleProperty('browser').getOrElse('chromium')
    }
}

// --- CUSTOM-suite test catalog (D0.5) -------------------------------------------------------
// See dev.vlaisanem.automation.tooling.TestCatalogGenerator's own Javadoc for what gets included/
// excluded and why. The catalog is a committed file, not a build/ output - CUSTOM's whole safety
// model depends on the server validating a client-submitted testKey against this exact snapshot,
// so it must be reviewable in a diff and checked for drift in CI, the same way the OpenAPI
// snapshot already is.
def testCatalogFile = file('src/test/resources/catalog/public-test-catalog.json')

tasks.register('testCatalogGenerate', JavaExec) {
    description = 'Regenerates the CUSTOM-suite PUBLIC test catalog via JUnit Platform discovery.'
    group = 'verification'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.vlaisanem.automation.tooling.TestCatalogGenerator'
    args testCatalogFile.absolutePath
}

tasks.register('testCatalogCheck') {
    description = 'Regenerates the CUSTOM-suite test catalog and fails if it drifted from what is committed.'
    group = 'verification'
    dependsOn 'testCatalogGenerate'
    doLast {
        // Scoped to exactly this one file - a global `git status --porcelain` would fail on any
        // unrelated local change elsewhere in the repo, which is not this check's concern.
        def status = rbpCapture(['git', 'status', '--porcelain', '--', testCatalogFile.absolutePath])
        if (!status.isEmpty()) {
            throw new GradleException(
                'Test catalog drifted from the committed snapshot - run ./gradlew testCatalogGenerate ' +
                "and commit the result:\n${status}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing']
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', '.github/**/*.yml', 'src/**/*.json', 'src/**/*.properties', 'src/**/*.xml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Runner modules (runner-contract/runner-listener/runner-service) each have their own build.gradle,
// so Spotless is not inherited from the root project's own config above - apply it here instead of
// duplicating the same java/misc blocks in every module's build.gradle.
subprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
        format 'misc', {
            target '*.gradle', '*.md', '.gitignore', 'src/**/*.json', 'src/**/*.properties', 'src/**/*.xml', 'src/**/*.yml'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
