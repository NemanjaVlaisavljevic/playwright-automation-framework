name: Performance Baseline (measurement-only)

# D4.4.2b - runs every k6 scenario against the real, unmodified production-policy topology
# (deploy/docker-compose.yml + docker-compose.performance.yml), the exact lifecycle
# performance/README.md documents and the 2026-09-08 review checkpoint already validated locally
# end to end. Originally measurement-only in intent for the per-endpoint `success_latency_ms{...}`
# thresholds (P1 correction #5 in the approved D4.4 plan, docs/RELEASE_EVIDENCE.md's "Faza D4.4.2a"
# section) - as of 2026-09-09 those are real, locked gates too (see public-read.js/artifact-reads.js/
# health.js/sse-replay.js's own comments), calibrated from four consecutive clean runs
# (34326415182, 34335917122, 34336865449, 34337509597) once the D4.4.2b root-cause fix below made
# "clean" mean something real. Every scenario's own correctness Rates/Counters
# (`unexpected_error_rate`, `create_run_correctness`, `sse_accepted_connections`, etc.) were already
# locked, real invariants from the start - all of it is deliberately BLOCKING now, never wrapped in
# `continue-on-error`.
#
# This was a genuine, real correction, not a design choice made up front: run #2 (2026-09-08,
# GitHub Actions run 34278044784) originally had `continue-on-error: true` on every scenario step,
# and it silently masked a real threshold crossing in `sse-connection-cap.js` (`sse_accepted_
# connections`/`sse_rejected_connections` both failed - 2 accepted/2 rejected instead of the real
# per-IP cap's expected 3/1 - k6 itself exited 99) behind a job that still showed all-green. See
# docs/RELEASE_EVIDENCE.md's D4.4.2b "Run #2" subsection for the full investigation (the tracker's
# own code was reviewed and is provably race-free in isolation - the exact cause was not
# conclusively established from logs alone). `continue-on-error` removed from every scenario step
# as a direct result - a correctness regression must always turn this job red, never be silently
# swallowed the way run #2 first did. Every step from the first scenario onward now carries
# `if: always()` instead, so one scenario's real failure never prevents the remaining scenarios,
# the artifact upload, or teardown from still running.
#
# Root cause found after run #4 (2026-09-09, run 34327622491) produced a third, inverted split
# (1 accepted/3 rejected) - real raw-log timestamps proved sse-replay.js's actual k6 execution and
# sse-connection-cap.js's actual k6 execution are only ~0.9s apart (the 87s that looked like a gap
# in run #4's own docker-group timestamps was BuildKit/registry-metadata overhead, not test time).
# RunEventStreamController.SseRunEventSubscriber.onComplete()/onError() only called
# guard.complete()/completeWithError() and relied entirely on Spring's async servlet container to
# separately notice and invoke its own onCompletion/onError listener before the per-IP slot was
# ever released - a real, variable-length gap under CI load. Fixed at the source (both terminal
# callbacks now also call DeferredSubscriptionHandle#requestClose directly, releasing the slot the
# instant the broker itself knows a subscription is done). The "Wait for the per-IP SSE slot count
# to drain" step below is this workflow's own belt-and-suspenders proof of that fix, using the new
# runner.sse.client_slots.active gauge (SseConnectionsPerIpTracker) - a bounded poll, not a fixed
# sleep, so it fails fast with a precise message instead of masking a future regression the way a
# blind delay would.
#
# workflow_dispatch only, never a push/PR gate this phase - matches local-sut.yml's own reasoning
# (a full multi-container Compose lifecycle, including two Docker image builds, is too slow/heavy
# for every push). The throughput overlay (docker-compose.performance-throughput.yml, D4.4.2a) is
# deliberately not part of this workflow at all - only the production-policy scenarios get their
# latency thresholds calibrated against real CI-runner numbers; throughput's own local verification
# already stands on its own (see docs/RELEASE_EVIDENCE.md's "Faza D4.4.2a").
on:
  workflow_dispatch:

concurrency:
  group: performance-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE: >-
    docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.performance.yml
    --env-file deploy/performance.env
  COMPOSE_AUTH: >-
    docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.performance.yml
    -f deploy/docker-compose.performance-auth.yml --env-file deploy/performance.env

jobs:
  performance-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A real bug found on run #1 (2026-09-08): the stock grafana/k6 image runs its process as a
      # non-root user, but Docker auto-creates a missing bind-mount host directory as root - on
      # this GitHub-hosted runner (unlike this project's own local Docker Desktop dev machines,
      # which never showed this), that left `performance/k6/results/` owned by root with no
      # write access for k6's own non-root user, so every stock-`k6`-image scenario
      # (public-read/artifact-reads/health/create-run) logged a real
      # `could not open '/results/<name>.json': permission denied` and silently lost its own
      # machine-readable summary file, despite the step itself still reporting success (only the
      # file write failed, not the k6 process). The custom k6-sse image was unaffected only because
      # its own Dockerfile has no USER directive at all (runs as root). Creating the directory here
      # first (owned by the runner's own user, not Docker) and making it world-writable fixes this
      # for every k6 image regardless of which user it runs as - a throwaway CI VM, so 777 here
      # poses no real risk.
      - name: Ensure the k6 results directory is writable by every k6 container image
        run: |
          mkdir -p performance/k6/results
          chmod 777 performance/k6/results

      - name: Bring up postgres + runner-service (real, unmodified PORTFOLIO/Secure-cookie config)
        run: $COMPOSE up -d --build postgres runner-service

      - name: Wait for runner-service healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' runner-performance-runner-service-1 2>/dev/null || echo missing)
            echo "check $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "runner-service never became healthy" >&2
          exit 1

      - name: Seed the database (500 terminal runs, incl. perf-replay-run/artifact examples)
        run: $COMPOSE run --rm --build performance-seed

      - name: Bring up web
        run: $COMPOSE up -d --build web

      - name: Run public-read.js (production-policy)
        run: $COMPOSE run --rm --build k6 run /scripts/public-read.js

      - name: Run artifact-reads.js (production-policy)
        if: always()
        run: $COMPOSE run --rm --build k6 run /scripts/artifact-reads.js

      - name: Run health.js
        if: always()
        run: $COMPOSE run --rm --build k6 run /scripts/health.js

      - name: Insert the SSE hold-open fixture (perf-hold-open-run)
        if: always()
        run: $COMPOSE run --rm --build performance-seed-live ./seed-live-run.sh insert

      - name: Run sse-replay.js
        if: always()
        run: $COMPOSE run --rm --build k6-sse run /scripts/sse-replay.js

      # D4.4.2b - a real CI finding (run #2/#4): sse-replay.js's own terminal-run connections can
      # still be counted against the per-IP cap for a short window after the broker itself already
      # considers them done, and sse-connection-cap.js starts under a second later, reusing the
      # same client IP (both are ephemeral `docker compose run` containers on the same network).
      # A bounded poll on the new runner.sse.client_slots.active gauge, not a fixed sleep - passes
      # instantly once genuinely drained, and fails fast with a precise message instead of silently
      # letting sse-connection-cap.js start from a non-zero baseline the way run #2/#4 did.
      - name: Wait for the per-IP SSE slot count to drain after the terminal replay
        if: always()
        run: |
          for i in $(seq 1 20); do
            value=$(docker exec runner-performance-runner-service-1 curl -fsS http://127.0.0.1:8080/actuator/prometheus | awk '/^runner_sse_client_slots_active / {print $2}')
            echo "check $i: runner_sse_client_slots_active=$value"
            if [ "$value" = "0.0" ]; then exit 0; fi
            sleep 1
          done
          echo "SSE per-IP slots did not drain after terminal replay" >&2
          exit 1

      - name: Run sse-connection-cap.js
        if: always()
        run: $COMPOSE run --rm --build k6-sse run /scripts/sse-connection-cap.js

      - name: Delete the SSE hold-open fixture
        if: always()
        run: $COMPOSE run --rm performance-seed-live ./seed-live-run.sh delete

      - name: Apply the auth override for create-run.js (wiremock + LOCAL_DEV/non-Secure cookie)
        if: always()
        run: $COMPOSE_AUTH up -d --build runner-service wiremock

      - name: Wait for runner-service healthy (auth override applied)
        if: always()
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' runner-performance-runner-service-1 2>/dev/null || echo missing)
            echo "check $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "runner-service never became healthy after the auth override" >&2
          exit 1

      - name: Run create-run.js
        if: always()
        run: $COMPOSE_AUTH run --rm --build k6 run /scripts/create-run.js

      - name: Revert runner-service back to the real, unmodified config
        if: always()
        run: $COMPOSE up -d --build runner-service

      - name: Wait for runner-service healthy (reverted)
        if: always()
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' runner-performance-runner-service-1 2>/dev/null || echo missing)
            echo "check $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "runner-service never became healthy after reverting the auth override" >&2
          exit 1

      # D4.4.3a - the summarizer (runner-dashboard/scripts/summarize-baseline.mjs) requires this
      # sidecar alongside the six raw results below; it never guesses provenance from its own
      # environment (a review finding - reconstructing this after the fact from Actions API/log
      # scraping would be strictly weaker and error-prone). k6Version is read from the same
      # docker-compose.performance.yml pin the k6 service itself uses, not hand-duplicated, so a
      # future version bump can never leave this sidecar silently stale.
      - name: Generate the metadata.json sidecar for the baseline summarizer
        if: always()
        run: |
          k6_version=$(grep -oE 'grafana/k6:[0-9]+\.[0-9]+\.[0-9]+' deploy/docker-compose.performance.yml | head -1 | cut -d: -f2)
          cat > performance/k6/results/metadata.json <<EOF
          {
            "measuredAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commitSha": "${{ github.sha }}",
            "profile": "production-policy",
            "executionMode": "cold",
            "repetitions": 1,
            "runnerImage": "ubuntu-latest",
            "k6Version": "$k6_version",
            "workflowRun": {
              "id": ${{ github.run_id }},
              "attempt": ${{ github.run_attempt }},
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          }
          EOF
          cat performance/k6/results/metadata.json

      - name: Dump container logs
        if: failure()
        run: $COMPOSE_AUTH logs --no-color > compose-logs.txt

      - name: Upload k6 results + diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            performance/k6/results/
            compose-logs.txt

      - name: Tear down (fully throwaway - volumes intentionally removed)
        if: always()
        continue-on-error: true
        run: $COMPOSE_AUTH --profile tools down -v
