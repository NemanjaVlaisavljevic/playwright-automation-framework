name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  read-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Chromium
        run: ./gradlew playwrightInstall -PwithDeps=true

      - name: Formatting and read-only test gate
        # --rerun applies only to `test` (the task it's associated with) - forces real execution
        # against the live public app instead of a possible FROM-CACHE hit (see local-sut.yml for the
        # full explanation of why this project's caching setup makes that a real risk).
        run: ./gradlew spotlessCheck test --rerun

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/tests/
            build/test-results/
            build/allure-results/
            build/artifacts/
