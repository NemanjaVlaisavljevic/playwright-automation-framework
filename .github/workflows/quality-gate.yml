name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  read-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Chromium
        run: ./gradlew playwrightInstall -PwithDeps=true

      - name: Formatting and read-only test gate
        run: ./gradlew spotlessCheck test

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automation-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/tests/
            build/test-results/
            build/allure-results/
            build/artifacts/
