# Backup/restore overlay, never merged into the base docker-compose.yml directly.
#
# Two reasons this is its own file, not a service added to the base one:
#
# 1. Docker Compose interpolates every `${VAR:?message}` in a file's service definitions while
#    building its config model, regardless of which `profiles:` are activated - a
#    `profiles: ["backup"]`-gated service defined in the base file would still make a bare
#    `docker compose -f docker-compose.yml up` fail the moment BACKUP_AGE_RECIPIENT/BACKUP_REMOTE/
#    BACKUP_BUCKET/BACKUP_RCLONE_CONFIG_FILE are unset, which they are until an operator has set up
#    off-site backup. Splitting into a separate file means these variables are only interpolated
#    when this file is explicitly included.
# 2. The `backup` service needs real internet egress (to reach an S3-compatible bucket) that the
#    base file's `data` network deliberately does not provide (`internal: true` - no gateway at
#    all for `runner-service`/`postgres`). A plain, non-internal `backup-egress` network below is
#    added to this service alongside `data` (still needed to reach `postgres` by DNS name) -
#    `postgres`/`runner-service` themselves stay fully isolated from the internet.
#
# Usage - a routine backup run (host-level systemd timer, documented in the D4.6 operational
# runbook, not here):
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml --env-file .env \
#     run --rm backup
#
# A restore is always a manual, one-off override on top of the above - BACKUP_AGE_IDENTITY_FILE (the
# private age identity key) never sits in this file's standing config; it exists on this host only
# for the duration of this one invocation, mounted read-only from wherever it is actually kept at
# rest (offline/a password manager - see backup.sh/restore.sh's own headers). RESTORE_EXPECTED_DATABASE
# is cross-checked against what Postgres itself reports via `SELECT current_database()`, never just
# the name PGDATABASE claims; restore.sh prints the exact RESTORE_CONFIRM_DESTRUCTIVE value it
# expects (tied to this database name and backup identifier - never a generic "yes") in its own
# refusal message if the target isn't genuinely empty.
#
# Restoring into THIS SAME production database (the ordinary disaster-recovery case) needs no
# override at all - restore.sh picks up PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD directly from
# this service's own ambient environment below:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml --env-file .env \
#     run --rm \
#     -e RESTORE_EXPECTED_DATABASE=runner \
#     -e BACKUP_AGE_IDENTITY_FILE=/secrets/identity.txt \
#     -v /path/to/offline/identity.txt:/secrets/identity.txt:ro \
#     backup ./restore.sh <backup-identifier>
#
# Restoring into a genuinely different target overrides all five PG* variables at once - never as a
# literal `-e` argument (the password would sit in shell history). See docs/RUNBOOK.md section 10 for
# the full `run --env-from-file` procedure.
#
# See docs/DEPLOYMENT_ARCHITECTURE.md section 7 for the full design writeup.
services:
  backup:
    build:
      context: ./backup
    networks:
      - data
      - backup-egress
    environment:
      # Standard libpq connection variables, passed directly (never assembled into a URL first) -
      # five separate KEY=VALUE variables have no URL syntax to disambiguate, so an arbitrary
      # password (including one containing `@`/`:`/`/`/`%`) passes through correctly with no
      # parsing step needed.
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-runner}
      - PGUSER=${POSTGRES_USER:-runner}
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see deploy/.env.example}
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env - see deploy/.env.example}
      - BACKUP_REMOTE=${BACKUP_REMOTE:?set BACKUP_REMOTE in .env - see deploy/.env.example}
      - BACKUP_BUCKET=${BACKUP_BUCKET:?set BACKUP_BUCKET in .env - see deploy/.env.example}
      - BACKUP_PREFIX=${BACKUP_PREFIX:-runner-backups}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-}
      # The disk-budget guard's own inputs (see .env.example for what each one means).
      - BACKUP_MIN_FREE_BYTES=${BACKUP_MIN_FREE_BYTES:-104857600}
      - BACKUP_DUMP_RESERVE_BYTES=${BACKUP_DUMP_RESERVE_BYTES:-104857600}
      # Real rclone env var name (not invented here) - points at the config file holding
      # BACKUP_REMOTE's real credentials. Mounted read-only below, never baked into the image.
      - RCLONE_CONFIG=/secrets/rclone.conf
    volumes:
      - backup-local:/backups
      - ${BACKUP_RCLONE_CONFIG_FILE:?set BACKUP_RCLONE_CONFIG_FILE in .env - see deploy/.env.example}:/secrets/rclone.conf:ro
    command: ["./backup.sh"]

networks:
  # Deliberately NOT internal - the whole point is real egress to an S3-compatible bucket. Only
  # `backup` ever joins it; `postgres`/`runner-service`/`web` are all untouched by this file.
  backup-egress:

volumes:
  backup-local:
