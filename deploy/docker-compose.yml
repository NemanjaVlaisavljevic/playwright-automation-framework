# Production topology - three long-lived containers. `web` publishes 80/443 (real TLS once
# SITE_ADDRESS names a real domain in deploy/.env - see deploy/.env.example and
# docs/DEPLOYMENT_ARCHITECTURE.md section 5); `runner-service`/`postgres` publish nothing at all -
# see docker-compose.debug.yml for local loopback-only access to those two instead.
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Two networks, not one: `edge` (web <-> runner-service) and `data` (runner-service <-> postgres,
# `internal: true` - no default-network access at all, not even for `web`). Without this split,
# every service would share one default network and `web` could reach `postgres` directly,
# undermining the "no public/no-other-service Postgres access" boundary.
#
# No Docker socket is mounted anywhere - the runner never manages its own host, in a container or
# otherwise.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    networks:
      - edge
    # Bounds this container's own stdout log growth, which is entirely outside
    # DiskUsageService's accounting.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    # Deliberately a plain dependency, not `condition: service_healthy` - runner-service's own
    # readiness can reflect self-resolving conditions (disk-low, startup recovery, DEGRADED) that
    # Caddy starting sooner can't fix anyway. Caddy starts regardless of runner-service's health;
    # the API returns a real 502 until the backend is reachable, which the dashboard already
    # surfaces and recovers from on its own (see BackendUnavailableE2eTest).
    depends_on:
      - runner-service
    # SITE_ADDRESS names the real domain once one exists - Caddy then automatically obtains and
    # renews a TLS certificate via ACME/Let's Encrypt, using the persistent caddy-data volume below
    # to avoid re-requesting one (and hitting rate limits) on every container recreate. Deliberately
    # a bare variable reference, not `${SITE_ADDRESS:-}`: Compose only omits the container env var
    # entirely when it's genuinely undefined, which is what lets the Caddyfile's own
    # {$SITE_ADDRESS::80} placeholder default apply - `${SITE_ADDRESS:-}` would instead set an
    # empty string, which Caddy parses as a bare global-options block and fails to start. Leave
    # deploy/.env's own SITE_ADDRESS line commented out until a real domain exists.
    environment:
      - SITE_ADDRESS
    # WEB_HTTP_BIND/WEB_HTTPS_BIND - production defaults to the real 80/443 below; only set them in
    # deploy/.env to remap the host side for a local run whose host already has something else
    # bound to 80/443 (see deploy/.env.example). The container-side ports (:80/:443) never change -
    # only which host port they land on.
    ports:
      - "${WEB_HTTP_BIND:-80}:80"
      - "${WEB_HTTPS_BIND:-443}:443"
      - "${WEB_HTTPS_BIND:-443}:443/udp" # HTTP/3 (QUIC) - harmless even before SITE_ADDRESS names a domain.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  runner-service:
    build:
      context: ..
      dockerfile: deploy/runner-service/Dockerfile
      # Passed through to the Dockerfile's own ARG APP_VERSION (default "unknown"), baked into the
      # image at build time - becomes the ECS service.version field on every log line. A runtime
      # environment override cannot change this; only rebuilding with a different build arg can.
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    networks:
      - edge
      - data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    # Docker's own minimal init (tini) becomes PID 1 instead of java - forwards signals through and
    # reaps any orphaned grandchild process (a Gradle --no-daemon build, a forked JUnit worker,
    # Chromium's helper processes) that outlives its immediate parent during a forced-kill/cancel
    # path; java alone is not a real init/reaper for such processes.
    init: true
    depends_on:
      postgres:
        # Not just `depends_on: [postgres]` - Compose's default only waits for the container to
        # start, not for Postgres to actually accept connections. runner-service opens a real
        # connection and runs Flyway's migration at startup, so without this condition a fresh
        # `docker compose up` could start both at once and the JVM would fail its first connection
        # attempt.
        condition: service_healthy
    environment:
      - RUNNER_QUEUECAPACITY=5
      # The image already defaults RUNNER_DEPLOYMENTPROFILE to PORTFOLIO (fail-closed). Repeating
      # it here is deliberate belt-and-braces documentation - the one place a human reads to see
      # this deployment's actual profile. Hides Environment.LOCAL from /api/v1/capabilities and
      # rejects it outright at the validator - see RunAvailabilityPolicy. LOCAL needs the separate
      # seven-container Restful Booker Platform stack, which this deployment does not carry.
      - RUNNER_DEPLOYMENTPROFILE=PORTFOLIO
      # Points runner-service's spring.datasource.* at its sibling `postgres` service instead of
      # application.yml's localhost-only bootRun defaults. Reuses the same POSTGRES_DB/
      # POSTGRES_USER/POSTGRES_PASSWORD values the `postgres` service below is configured from.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-runner}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-runner}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see deploy/.env.example}
      # Admin authentication (GitHub OAuth2 Login). RunnerSecurityEnvironmentValidator fails
      # startup outright under PORTFOLIO if these are missing/malformed - see
      # docs/DEPLOYMENT_ARCHITECTURE.md section 4 and deploy/.env.example for how to obtain them.
      - RUNNER_SECURITY_GITHUB_CLIENT_ID=${RUNNER_SECURITY_GITHUB_CLIENT_ID:?set RUNNER_SECURITY_GITHUB_CLIENT_ID in .env - see deploy/.env.example}
      - RUNNER_SECURITY_GITHUB_CLIENT_SECRET=${RUNNER_SECURITY_GITHUB_CLIENT_SECRET:?set RUNNER_SECURITY_GITHUB_CLIENT_SECRET in .env - see deploy/.env.example}
      - RUNNER_SECURITY_ADMIN_GITHUB_ID=${RUNNER_SECURITY_ADMIN_GITHUB_ID:?set RUNNER_SECURITY_ADMIN_GITHUB_ID in .env - see deploy/.env.example}
      # Same escape-hatch shape as WEB_HTTP_BIND/WEB_HTTPS_BIND above: defaults to the real Secure
      # cookie the image already sets. Browsers refuse to send a Secure cookie to a non-HTTPS
      # origin, so a login round-trip over plain HTTP needs SESSION_COOKIE_SECURE=false in
      # deploy/.env to persist a session at all. Does not weaken PORTFOLIO's fail-closed guarantee:
      # RunnerSecurityEnvironmentPostProcessor still aborts startup if RUNNER_DEPLOYMENTPROFILE=
      # PORTFOLIO is combined with a non-Secure cookie - use this only together with a
      # non-PORTFOLIO RUNNER_DEPLOYMENTPROFILE for a local, non-TLS run.
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    volumes:
      - runner-data:/data
    # An operational/monitoring signal, not a restart trigger: `restart: unless-stopped` reacts
    # only to the container process exiting, never to health status alone - an unhealthy-but-alive
    # runner-service is never auto-restarted on account of this healthcheck. `--max-time 4` bounds
    # curl's wait below the outer `timeout: 5s`, so the probe fails on its own terms rather than
    # being killed mid-request.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4",
             "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-runner}
      - POSTGRES_USER=${POSTGRES_USER:-runner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see deploy/.env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  runner-data:
  pgdata:
  caddy-data:
  caddy-config:
