# Production topology - three long-lived containers. `web` publishes 80/443 (real TLS once
# SITE_ADDRESS names a real domain in deploy/.env - see deploy/.env.example and
# docs/DEPLOYMENT_ARCHITECTURE.md section 5); `runner-service`/`postgres` publish nothing at all -
# see docker-compose.debug.yml for local/D0-spike loopback-only access to those two instead.
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Two networks, not one: `edge` (web <-> runner-service) and `data` (runner-service <-> postgres,
# `internal: true` - no default-network access at all, not even for `web`). Without this split,
# every service shares one default network and `web` could reach `postgres` directly, undermining
# the "no public/no-other-service Postgres access" boundary even though nothing external is
# involved - caught during D0's own review round, not assumed safe from the Compose file alone.
#
# No Docker socket is mounted anywhere (the runner never manages its own host, in a container or
# otherwise - LOCAL-environment suites, which are the only thing that would need one, are out of
# scope for this deployment).
services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    networks:
      - edge
    depends_on:
      - runner-service
    # SITE_ADDRESS names the real domain once one exists (e.g. "example.com") - Caddy then
    # automatically obtains and renews a real TLS certificate for it via ACME/Let's Encrypt, using
    # the persistent caddy-data volume below to avoid re-requesting one (and hitting Let's
    # Encrypt's rate limits) on every container recreate. Deliberately a bare variable reference,
    # not `${SITE_ADDRESS:-}` - Compose only OMITS the container env var entirely when the
    # variable is genuinely undefined (both here and in deploy/.env), which is what lets the
    # Caddyfile's own {$SITE_ADDRESS::80} placeholder default apply. `${SITE_ADDRESS:-}` would
    # instead always set the container's SITE_ADDRESS to an empty string, which Caddy treats as a
    # real (empty) site address rather than falling back to its own default - confirmed live: that
    # exact form made Caddy fail to start with "unrecognized global option: encode", since an
    # empty site address parses as a bare global-options block instead of this file's actual site
    # block. Leave deploy/.env's own SITE_ADDRESS line commented out (see .env.example) until a
    # real domain exists - today's D0/D1 state keeps serving plain HTTP on :80.
    environment:
      - SITE_ADDRESS
    # WEB_HTTP_BIND/WEB_HTTPS_BIND (D2.6 review) - production always defaults to the real 80/443
    # below via Compose's own `${VAR:-default}` substitution; only set them in deploy/.env to
    # remap the host side for a local acceptance run whose host already has something else bound
    # to 80/443 (see deploy/.env.example) - a permanent, reusable escape hatch instead of a
    # throwaway override file a reviewer would otherwise have to hand-reconstruct from a doc
    # comment. The container-side ports (:80/:443) never change - only which host port they land
    # on.
    ports:
      - "${WEB_HTTP_BIND:-80}:80"
      - "${WEB_HTTPS_BIND:-443}:443"
      - "${WEB_HTTPS_BIND:-443}:443/udp" # HTTP/3 (QUIC) - harmless even before SITE_ADDRESS names a domain.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  runner-service:
    build:
      context: ..
      dockerfile: deploy/runner-service/Dockerfile
    networks:
      - edge
      - data
    # Docker's own minimal init (tini) becomes PID 1 instead of java - forwards signals through
    # (docker stop/compose restart still reach the JVM, see the Dockerfile's own CMD comment) and,
    # more importantly here, reaps any orphaned grandchild process (a Gradle --no-daemon build, a
    # forked JUnit worker, Chromium's own helper processes) that outlives its immediate parent
    # during a forced-kill/cancel path - java alone is not a real init/reaper for processes it never
    # directly re-parents to itself.
    init: true
    depends_on:
      postgres:
        # Not just `depends_on: [postgres]` (Compose's own default only waits for the container to
        # start, not for Postgres itself to actually accept connections) - RunnerServiceApplication
        # no longer excludes DataSourceAutoConfiguration/FlywayAutoConfiguration (D2.3), so it now
        # tries to open a real connection and run Flyway's migration at startup; without this
        # condition, a fresh `docker compose up` would start runner-service and postgres at the same
        # moment and the JVM would fail its very first connection attempt against a Postgres that
        # hasn't finished its own initialization yet.
        condition: service_healthy
    environment:
      - RUNNER_QUEUECAPACITY=5
      # This image's own Dockerfile already defaults RUNNER_DEPLOYMENTPROFILE to PORTFOLIO
      # (fail-closed - see its own comment for why that must not rely on this line alone). Repeating
      # the identical value here is deliberate belt-and-braces documentation, not redundant: it's
      # the one place a human reads to see this deployment's actual profile, and it stays correct
      # even if the image's own default is ever loosened for some other launch context. Hides
      # Environment.LOCAL from /api/v1/capabilities and rejects it outright at the validator - see
      # RunAvailabilityPolicy and docs/DEPLOYMENT_ARCHITECTURE.md section 2. LOCAL needs the
      # separate seven-container Restful Booker Platform stack running alongside it, which this
      # deployment does not carry.
      - RUNNER_DEPLOYMENTPROFILE=PORTFOLIO
      # D2.3 - points runner-service's own spring.datasource.* (see application.yml's own comment)
      # at its sibling `postgres` service instead of application.yml's localhost-only bootRun
      # defaults. Reuses the exact same POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD values the
      # `postgres` service below is configured from, rather than repeating them as separate literals
      # that could silently drift apart from what that service actually starts with.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-runner}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-runner}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see deploy/.env.example}
      # D3.2 - admin authentication (GitHub OAuth2 Login). RunnerSecurityEnvironmentValidator
      # fails startup outright under PORTFOLIO if these are missing/malformed - see
      # docs/DEPLOYMENT_ARCHITECTURE.md section 4 and deploy/.env.example for how to obtain them.
      - RUNNER_SECURITY_GITHUB_CLIENT_ID=${RUNNER_SECURITY_GITHUB_CLIENT_ID:?set RUNNER_SECURITY_GITHUB_CLIENT_ID in .env - see deploy/.env.example}
      - RUNNER_SECURITY_GITHUB_CLIENT_SECRET=${RUNNER_SECURITY_GITHUB_CLIENT_SECRET:?set RUNNER_SECURITY_GITHUB_CLIENT_SECRET in .env - see deploy/.env.example}
      - RUNNER_SECURITY_ADMIN_GITHUB_ID=${RUNNER_SECURITY_ADMIN_GITHUB_ID:?set RUNNER_SECURITY_ADMIN_GITHUB_ID in .env - see deploy/.env.example}
      # SESSION_COOKIE_SECURE (D3.2 review) - same escape-hatch shape as WEB_HTTP_BIND/
      # WEB_HTTPS_BIND above: defaults to the real Secure cookie this image's own Dockerfile
      # already sets, so a bare `docker compose up` stays fail-closed with no override present.
      # Browsers refuse to send a Secure cookie to a non-HTTPS origin, so a login round-trip
      # against this stack over plain HTTP (no SITE_ADDRESS/TLS configured yet) needs
      # SESSION_COOKIE_SECURE=false in deploy/.env to even persist a session at all. This does not
      # weaken PORTFOLIO's own fail-closed guarantee: RunnerSecurityEnvironmentPostProcessor still
      # aborts startup outright if RUNNER_DEPLOYMENTPROFILE=PORTFOLIO (the default above) is ever
      # combined with a non-Secure cookie - use this override only together with a non-PORTFOLIO
      # RUNNER_DEPLOYMENTPROFILE for such a local, non-TLS acceptance run.
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    volumes:
      - runner-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    networks:
      - data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-runner}
      - POSTGRES_USER=${POSTGRES_USER:-runner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see deploy/.env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  runner-data:
  pgdata:
  caddy-data:
  caddy-config:
