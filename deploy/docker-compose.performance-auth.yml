# OAuth-only override, additional to docker-compose.performance.yml, used ONLY around create-run.js.
# Deliberately kept out of docker-compose.performance.yml itself: if this override lived in the
# always-applied performance overlay, the read-path/SSE scenarios would silently also run under
# LOCAL_DEV + a non-Secure cookie instead of the real PORTFOLIO + Secure-cookie posture they need to
# be validated against.
#
# Required sequence around create-run.js (never just `run --rm k6 run /scripts/create-run.js`
# against the plain performance.yml stack - see performance/README.md's own step 3c for the full
# commands):
#   a. Recreate runner-service WITH this file added, plus bring up wiremock:
#        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.performance.yml \
#          -f deploy/docker-compose.performance-auth.yml --env-file deploy/performance.env \
#          up -d --build runner-service wiremock
#      (Compose recreates runner-service automatically because its resolved config changed - no
#      explicit `stop`/`rm` needed. This also re-runs RunRecoveryService's startup pass - safe only
#      because create-run.js runs last, after every SSE fixture has already been cleaned up, so
#      there is never a real RUNNING row for that pass to observe.)
#   b. Wait for runner-service healthy again, then run create-run.js against this now-LOCAL_DEV/
#      non-Secure-cookie instance.
#   c. Revert runner-service back to the real, unmodified config - WITHOUT this file:
#        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.performance.yml \
#          --env-file deploy/performance.env up -d --build runner-service
#      (again an automatic recreate, back to real PORTFOLIO + Secure cookie.)
#   d. Wait healthy again before moving on to teardown.
#
# Compose environment merging is additive by key across `-f` files, not full replacement - use
# `docker compose ... config` to confirm the final resolved runner-service.environment rather than
# assuming from the YAML alone.
#
# create-run.js's own results are therefore an authenticated-write-path measurement under an
# isolated HTTP (non-TLS) test override, not a fully production-identical TLS/OAuth result - real
# Secure-cookie/TLS acceptance for the write path is deferred to D5. It never touches the base
# docker-compose.yml, never affects the other scenarios, and is reverted immediately after
# create-run.js finishes.
services:
  # Stands in for github.com so create-run.js can perform a real GitHub OAuth2 admin login (never
  # a fake ClientRegistrationRepository - stubs only the external dependency, keeps the app's real
  # OAuth2 binding/wiring) with no outbound call ever made to the real GitHub. Stub mappings in
  # performance/wiremock/mappings/ cover the three server-to-server calls Spring's OAuth2 login
  # flow makes: the authorize redirect, the token exchange, and the user-info lookup.
  # `--global-response-templating` lets authorize.json echo the real request's `redirect_uri`/
  # `state` query params back in its `Location` header.
  wiremock:
    image: wiremock/wiremock:3.9.1
    profiles: ["tools"]
    command: ["--global-response-templating"]
    networks:
      - edge
    volumes:
      - ../performance/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      # Not `wget --spider` - its default HEAD request gets a 404 from WireMock's /__admin/health
      # endpoint, which only implements GET. curl performs a real GET instead.
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redirects the real Spring OAuth2 client's provider URIs at `wiremock` instead of the real
  # github.com (the base docker-compose.yml's own registration.github.{client-id,client-secret,
  # redirect-uri} stay untouched - this overlay only changes where the provider lives). Merges
  # additively with the base file's `runner-service.environment`.
  #
  # SERVER_SERVLET_SESSION_COOKIE_SECURE=false + RUNNER_DEPLOYMENTPROFILE=LOCAL_DEV: this isolated
  # stack has no real TLS (Caddy serves plain HTTP), and a standards-compliant HTTP client never
  # sends a Secure-flagged cookie over plain HTTP regardless of same-origin - with the base file's
  # default (`true` + PORTFOLIO), the session cookie the OAuth2 login flow depends on would be
  # silently dropped after the first `Set-Cookie`, and RunnerSecurityEnvironmentPostProcessor's
  # fail-closed check refuses to even start with PORTFOLIO + a non-Secure cookie. Same escape hatch
  # `deploy/.env.example`'s SESSION_COOKIE_SECURE comment documents, always paired with a
  # non-PORTFOLIO profile override.
  runner-service:
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GITHUB_AUTHORIZATION_URI=http://wiremock:8080/login/oauth/authorize
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GITHUB_TOKEN_URI=http://wiremock:8080/login/oauth/access_token
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GITHUB_USER_INFO_URI=http://wiremock:8080/user
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GITHUB_USER_NAME_ATTRIBUTE=id
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=false
      - RUNNER_DEPLOYMENTPROFILE=LOCAL_DEV
